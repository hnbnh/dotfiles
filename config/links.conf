# How relink maps this repo into $HOME.
#
#   config/foo/   -> ~/.config/foo      (one directory symlink)
#   config/.foo/  -> ~/.foo             (one directory symlink)
#
# shared <dir>
#   The tool writes into this directory too, so link tracked files
#   individually and leave the destination a real directory. Tool state
#   stays in $HOME and never enters the repo.
#
# link <src> <dest>
#   An extra symlink convention cannot express. Additive: the directory
#   link above still happens.
#
# NEVER mark these shared, however plausible they look:
#
#   zsh, tmux, awesome   They contain git submodules (config/zsh/plugins/*,
#     config/tmux/plugins/*, config/awesome/lain). A gitlink under a shared
#     root is skipped by migration with a warning, then shows as permanent
#     drift; running --force against that drift line destroys the submodule
#     working tree. Resolve that first if one of these ever needs to be shared.
#
#   wallpapers   Contains a C-quoted path, which tracked_rel mishandles
#     because it does not use `git ls-files -z`.

shared  .claude
shared  .codex
shared  .cursor
shared  .gemini
shared  lazygit
shared  zed
shared  karabiner
shared  yazi
shared  opencode
shared  herdr

# zsh reads $HOME/.zshenv before ZDOTDIR is knowable.
link  zsh/.zshenv  ~/.zshenv
# Not ZDOTDIR: it would relocate .zim/ and .zcompdump* into the repo
# (config/zsh/zim.zsh:105 and :50 resolve against ${ZDOTDIR:-$HOME}).
link  zsh/.zshrc   ~/.zshrc
link  zsh/.zimrc   ~/.zimrc
# Carried over untested — Linux/X11 only, so left exactly as it is today.
link  betterlockscreen/betterlockscreenrc  ~/.config/betterlockscreenrc
