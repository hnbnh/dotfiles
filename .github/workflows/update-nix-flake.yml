name: update-nix-flake

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Snapshot package versions before update
        run: .github/scripts/package-versions.sh > "$RUNNER_TEMP/before.json"

      - name: Update flake lock
        run: nix flake update

      - name: Check updated flake
        run: |
          nix flake check
          for attr in \
            darwinConfigurations.hnbnh.system \
            systemConfigs.default \
            homeConfigurations.hnbnh.activationPackage \
            packages.aarch64-darwin.darwin-rebuild \
            packages.aarch64-linux.system-manager \
            packages.aarch64-linux.home-manager; do
            nix eval --raw ".#${attr}.drvPath"
            echo
          done

      - name: Build PR body
        run: |
          .github/scripts/package-versions.sh > "$RUNNER_TEMP/after.json"
          {
            echo 'Automated monthly update for `flake.lock`.'
            echo
            echo 'This updates all flake inputs (`nixpkgs`, `darwin`, `home-manager`, `system-manager`, `nix-system-graphics`) to their latest upstream revisions.'
            echo
            echo '## Package changes'
            echo
            .github/scripts/package-diff.sh "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md"

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-nix-flake
          add-paths: flake.lock
          commit-message: "chore(nix): update flake lock"
          title: "chore(nix): update flake lock"
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
