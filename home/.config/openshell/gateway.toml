[openshell]
version = 2

[openshell.gateway]
compute_driver = "docker"

[openshell.drivers.docker]
default_image = "openshell-sandbox:latest"
image_pull_policy = "never"
# osb passes a bind mount of the workdir and the osb-creds volume.
allow_driver_config = true
enable_bind_mounts = true

# Admission rejects host bind mounts outright, since they carry no labels.
[openshell.drivers.docker.resource_admission]
enabled = false
