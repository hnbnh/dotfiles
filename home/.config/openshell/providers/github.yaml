# Upstream providers/github.yaml (v0.1.2) with binaries matched to the osb
# image. Since 0.1.0 the gateway ships no profiles; osb provider imports this.
#
# gh is a nixpkgs wrapper script that execs .gh-wrapped in the same pid, so
# only the glob matches it. See policy.yaml for the agents' own GitHub rules.

id: github
display_name: GitHub
description: GitHub API and Git operations
category: source_control
credentials:
  - name: api_token
    description: GitHub token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.github.com
    port: 443
    path: /graphql
    protocol: graphql
    access: read-only
    enforcement: enforce
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "**" }
      - allow: { method: HEAD, path: "**" }
      - allow: { method: OPTIONS, path: "**" }
      - allow: { method: POST, path: "/**/git-upload-pack" }
binaries:
  - /usr/bin/git
  - /usr/local/bin/gh
  - /nix/store/*-gh-*/bin/.gh-wrapped
